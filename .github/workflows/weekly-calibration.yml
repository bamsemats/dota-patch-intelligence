name: Weekly Winrate Calibration & Auto-Tuner

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allows manual trigger from the UI

permissions:
  contents: write
  pull-requests: write

jobs:
  calibrate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch Latest Winrates
        run: npm run patch:fetch-winrates

      - name: Fetch Weekly Winrates Tracking Snapshot
        run: npm run patch:fetch-weekly

      - name: Run Safe Regression Calibration Gate
        # Runs the gate to adjust weights, regenerate vectors, and verify no accuracy regressions
        run: npm run patch:calibrate-safe

      - name: Commit and Push Weekly Winrates & Approved Weights
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage weekly winrates and balance_metrics.json (if any)
          git add research-output/weekly-winrates/ research-output/ontology/balance_metrics.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            if git diff --staged --name-only | grep -q "balance_metrics.json"; then
              BRANCH_NAME="calibration/auto-tune-${{ github.run_id }}"
              git checkout -b "$BRANCH_NAME"
              git commit -m "chore(ontology): auto-tune balance weights and save weekly winrates"
              git push origin "$BRANCH_NAME" --force
              
              gh pr create \
                --title "chore(ontology): auto-tune balance metrics & weekly winrates" \
                --body "This PR was automatically generated by the Weekly Winrate Calibration workflow. The auto-tuned balance weights passed the regression gate and did not degrade global prediction accuracy." \
                --head "$BRANCH_NAME" \
                --base main
            else
              git commit -m "chore(data): save weekly winrates snapshot"
              git push origin main
            fi
          fi
