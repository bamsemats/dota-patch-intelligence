name: Dota Patch Watcher & Automation Pipeline

on:
  schedule:
    # Run every 6 hours (adjust as needed during major tournament seasons)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI
    inputs:
      force_version:
        description: 'Force process a specific version (e.g., 7.42). Leave blank for auto-discovery.'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "patch-pipeline"
  cancel-in-progress: false

jobs:
  check-and-process:
    runs-on: ubuntu-latest
    
    # We need a PostgreSQL service for the db:seed step of the pipeline
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: dota_patch_intel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can commit back
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Initialize Database Schema
        env:
          DATABASE_URL: postgresql://root:rootpassword@localhost:5432/dota_patch_intel?schema=public
        run: npx prisma db push --schema apps/api/prisma/schema.prisma

      - name: Check for New Patch (Discovery)
        id: discovery
        run: |
          if [ -n "${{ github.event.inputs.force_version }}" ]; then
            echo "Forcing version: ${{ github.event.inputs.force_version }}"
            echo "NEW_PATCH_VERSION=${{ github.event.inputs.force_version }}" >> $GITHUB_ENV
            echo "FOUND_NEW=true" >> $GITHUB_ENV
          else
            # Run the discovery script and capture its output
            # The script needs to be modified to output a specific flag if a new patch is found, 
            # but for now we assume it writes to a temporary file or we parse stdout.
            # Assuming patchDiscovery outputs something like "NEW_PATCH=7.42"
            DISCOVERY_OUTPUT=$(npm run patch:discovery --silent)
            echo "$DISCOVERY_OUTPUT"
            
            # Simple bash extraction (requires patchDiscovery.ts to be updated to output this format reliably)
            # For this example, we'll look for a line starting with NEW_PATCH=
            VERSION=$(echo "$DISCOVERY_OUTPUT" | grep "^NEW_PATCH=" | cut -d'=' -f2)
            
            if [ -n "$VERSION" ]; then
              echo "Found new patch: $VERSION"
              echo "NEW_PATCH_VERSION=$VERSION" >> $GITHUB_ENV
              echo "FOUND_NEW=true" >> $GITHUB_ENV
            else
              echo "No new patch found."
              echo "FOUND_NEW=false" >> $GITHUB_ENV
            fi
          fi

      - name: Run Automation Pipeline
        if: env.FOUND_NEW == 'true'
        env:
          DATABASE_URL: postgresql://root:rootpassword@localhost:5432/dota_patch_intel?schema=public
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Executing pipeline for version: ${{ env.NEW_PATCH_VERSION }}"
          npx tsx apps/scripts/automationPipeline.ts ${{ env.NEW_PATCH_VERSION }}

      - name: Commit and Push Generated Artifacts
        if: env.FOUND_NEW == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage the new research-output JSON files
          git add research-output/
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No artifacts generated to commit."
          else
            BRANCH_NAME="patch-auto/${{ env.NEW_PATCH_VERSION }}"
            git checkout -b "$BRANCH_NAME"
            git commit -m "chore(data): auto-process patch ${{ env.NEW_PATCH_VERSION }}"
            git push origin "$BRANCH_NAME" --force
            
            gh pr create \
              --title "chore(data): auto-process patch ${{ env.NEW_PATCH_VERSION }}" \
              --body "This PR was automatically generated by the Patch Watcher workflow because a new Dota 2 patch was discovered: **${{ env.NEW_PATCH_VERSION }}**. Please review the classification, vector deltas, and strategic predictions before merging to main." \
              --head "$BRANCH_NAME" \
              --base main
          fi
